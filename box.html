<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Work Station | SOC Learning</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #0a0a0f;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            overflow-x: hidden;
        }

        /* ===== CANVAS PARTICLES ===== */
        #particleCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            background: #0a0a0f;
        }

        /* ===== MAIN CONTAINER ===== */
        .container {
            position: relative;
            z-index: 2;
            max-width: 800px;
            width: 100%;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 24px;
            padding: 50px 45px;
            backdrop-filter: blur(10px);
            box-shadow: 0 20px 80px rgba(0, 0, 0, 0.5);
            transition: all 0.4s ease;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }

        .container:hover {
            border-color: rgba(124, 58, 237, 0.2);
            box-shadow: 0 20px 80px rgba(124, 58, 237, 0.05);
        }

        /* ===== HEADER ===== */
        .header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 30px;
            padding-bottom: 18px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }

        .header-icon {
            font-size: 28px;
            color: #7c3aed;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #7c3aed, #06b6d4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* ===== ITEM ===== */
        .item {
            display: flex;
            align-items: flex-start;
            gap: 18px;
            padding: 20px 24px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            transition: all 0.4s ease;
        }

        .item:hover {
            background: rgba(124, 58, 237, 0.04);
            border-color: rgba(124, 58, 237, 0.15);
            transform: translateX(4px);
        }

        .item .number {
            font-size: 22px;
            font-weight: 900;
            color: #7c3aed;
            min-width: 40px;
            font-family: 'Courier New', monospace;
        }

        .item .content {
            flex: 1;
        }

        .item .content .title {
            font-size: 20px;
            font-weight: 700;
            color: #e0e0e0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .item .content .title span {
            background: linear-gradient(135deg, #7c3aed, #06b6d4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .item .content .desc {
            font-size: 14px;
            color: #888;
            margin-top: 4px;
        }

        .item .content .desc i {
            color: #7c3aed;
            margin-right: 6px;
        }

        .item .status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 16px;
            border-radius: 50px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            background: rgba(34, 197, 94, 0.1);
            color: #22c55e;
            border: 1px solid rgba(34, 197, 94, 0.1);
            white-space: nowrap;
        }

        .item .status i {
            font-size: 11px;
        }

        /* ===== FOOTER ===== */
        .footer-text {
            margin-top: 25px;
            padding-top: 18px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            font-size: 12px;
            color: #444;
            text-align: center;
            letter-spacing: 1px;
        }

        .footer-text i {
            color: #7c3aed;
            margin: 0 4px;
        }

        /* ===== COPY PROTECTION ===== */
        .copy-protection {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 10px;
            color: #222;
            letter-spacing: 2px;
            text-transform: uppercase;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            pointer-events: none;
            z-index: 999;
        }

        .copy-protection i {
            color: #7c3aed;
            margin-right: 6px;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            body {
                padding: 20px;
            }
            .container {
                padding: 30px 24px;
            }
            .header h1 {
                font-size: 18px;
            }
            .item {
                padding: 16px 18px;
                flex-wrap: wrap;
            }
            .item .number {
                font-size: 18px;
                min-width: 30px;
            }
            .item .content .title {
                font-size: 16px;
            }
            .item .status {
                font-size: 10px;
                padding: 3px 12px;
                margin-left: auto;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 20px 16px;
            }
            .header h1 {
                font-size: 15px;
            }
            .header-icon {
                font-size: 22px;
            }
            .item {
                padding: 14px 14px;
                flex-direction: column;
                gap: 6px;
            }
            .item .number {
                font-size: 16px;
                min-width: auto;
            }
            .item .content .title {
                font-size: 14px;
            }
            .item .status {
                font-size: 9px;
                padding: 2px 10px;
                align-self: flex-start;
            }
        }
    </style>
</head>
<body>

    <!-- ===== CANVAS PARTICLES ===== -->
    <canvas id="particleCanvas"></canvas>

    <!-- ===== MAIN CONTAINER ===== -->
    <div class="container">

        <!-- HEADER -->
        <div class="header">
            <div class="header-icon">
                <i class="fas fa-laptop-code"></i>
            </div>
            <h1>My Work Station</h1>
        </div>

        <!-- SINGLE ITEM -->
        <div class="item">
            <span class="number">1.</span>
            <div class="content">
                <div class="title">
                    <span>JavaScript-Based Credential Stealer</span> Analysis
                </div>
                <div class="desc">
                    <i class="fas fa-bolt"></i> Agent Tesla Malware Investigation
                </div>
            </div>
            <span class="status">
                <i class="fas fa-check-circle"></i> Done
            </span>
        </div>

        <!-- FOOTER -->
        <div class="footer-text">
            <i class="fas fa-shield-alt"></i> SOC Investigation &bull; <i class="fas fa-arrow-right"></i> More Coming Soon
        </div>

    </div>

    <!-- ===== COPY PROTECTION ===== -->
    <div class="copy-protection">
        <i class="fas fa-copyright"></i> Copy Protected &bull; SOC Work Station
    </div>

    <script>
        // =============================================
        // CANVAS PARTICLES
        // =============================================
        var canvas = document.getElementById('particleCanvas');
        var ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        var particles = [];
        var colors = ['#7c3aed', '#ff6b35', '#ff1493', '#00b894', '#fdcb6e', '#0984e3', '#6c5ce7'];

        for (var i = 0; i < 50; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                radius: Math.random() * 2.5 + 1.5,
                dx: (Math.random() - 0.5) * 0.5,
                dy: (Math.random() - 0.5) * 0.5,
                color: colors[Math.floor(Math.random() * colors.length)],
                opacity: Math.random() * 0.12 + 0.04
            });
        }

        function drawParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(function(p) {
                p.x += p.dx;
                p.y += p.dy;
                if (p.x < 0 || p.x > canvas.width) p.dx *= -1;
                if (p.y < 0 || p.y > canvas.height) p.dy *= -1;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.opacity;
                ctx.fill();
            });
            requestAnimationFrame(drawParticles);
        }
        drawParticles();

        // =============================================
        // DISABLE RIGHT CLICK
        // =============================================
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
            alert('🔒 Copying is disabled. This is a SOC work station.');
        });

        // =============================================
        // DISABLE KEYBOARD SHORTCUTS
        // =============================================
        document.addEventListener('keydown', function(e) {
            if (
                (e.ctrlKey && (e.key === 'c' || e.key === 'u' || e.key === 's' || e.key === 'p')) ||
                e.key === 'F12'
            ) {
                e.preventDefault();
                alert('🔒 Copying is disabled. This is a SOC work station.');
                return false;
            }
        });

        // =============================================
        // DISABLE SELECTION
        // =============================================
        document.addEventListener('selectstart', function(e) {
            e.preventDefault();
        });

        document.addEventListener('dragstart', function(e) {
            e.preventDefault();
        });
    </script>

</body>
</html>
